
name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      - name: Locate Android SDK tools and install API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          set +o pipefail
          if yes | "$SDKMANAGER" --licenses; then
            LICENSE_STATUS=0
          else
            LICENSE_STATUS=$?
          fi
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "ERROR: Android SDK license acceptance failed."
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --install "platforms;android-37.0"

          if [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s "$SDK_ROOT/platforms/android-37.0" \
                  "$SDK_ROOT/platforms/android-37"
          fi
      
      

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest


      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GitQuest-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitQuest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
